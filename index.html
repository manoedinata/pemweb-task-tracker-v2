<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker Kuliah v2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>📋 Task Tracker Kuliah <span class="badge">v2 · REST API</span></h1>

    <form id="task-form" novalidate>
      <input
        type="text"
        id="judul"
        name="judul"
        placeholder="Judul tugas (min. 3 karakter)"
      />

      <div class="form-row">
        <select id="matkul" name="matkul" disabled>
          <option value="">Memuat mata kuliah…</option>
        </select>
        <input type="date" id="deadline" name="deadline" />
        <button type="submit" id="submit-btn">Tambah</button>
      </div>

      <p id="form-error" class="error" hidden></p>
    </form>

    <input
      type="search"
      id="search"
      class="search-input"
      placeholder="Cari tugas…"
    />

    <div class="filter-row">
      <div class="filters">
        <button type="button" class="filter-btn on" data-filter="semua">Semua</button>
        <button type="button" class="filter-btn" data-filter="aktif">Aktif</button>
        <button type="button" class="filter-btn" data-filter="selesai">Selesai</button>
      </div>
      <span id="counter"></span>
    </div>

    <p id="action-error" class="error" hidden></p>
    <div id="status-box" class="status-box"></div>

    <ul id="task-list"></ul>
    <p id="empty-message" class="empty-message" hidden>Tidak ada tugas di sini.</p>
  </main>

  <script src="mock-api-kampus.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
